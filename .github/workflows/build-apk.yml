name: Build & Release Research App APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchApp-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Research App v1.0.1 (Latest Build)' }}
          body: |
            ## Research App — Local-First Evidence, Discovery & Synthesis Engine

            ### Direct Downloads:
            - **Android APK:** [`app-debug.apk`](https://github.com/pandeysuryansh921-wq/research-app/releases/download/v1.0.1/app-debug.apk) (Ready to install on Android 8.0+)
            - **Detailed Architecture & Features Guide (PDF):** [`Research_App_Features_and_Architecture_Detailed.pdf`](https://github.com/pandeysuryansh921-wq/research-app/releases/download/v1.0.1/Research_App_Features_and_Architecture_Detailed.pdf)

            ### What's Included:
            - **Evidence-First Architecture:** Sources → Excerpts → Evidence → Claims → Matrices → Syntheses
            - **Research Command Center & PICO Builder:** Structured clinical & technical inquiry
            - **Live PubMed & arXiv Discovery:** Integrated literature search & 1-tap import
            - **8-State Reading Queue:** Inbox, Screening, Reading, Read, Key Benchmark, Exclusion audit
            - **Evidence Cards & Provenance Tracking:** Page numbers, character offsets, verbatim quotes, and researcher notes
            - **Contradiction Finder:** Conflict detection banner alerting opposing empirical findings across studies
            - **Multi-Study Evidence Matrix:** Study design, populations, interventions, and cell-level provenance
            - **Local-First Native SQLite:** 8 relational tables, indexed foreign keys, reactive Coroutines/Flow
            - **Ecosystem Bridges:** Deep links (`research://...`), Likhoji IME, Boloji voice, Stylus Notes & Productivity handoffs
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            Research_App_Features_and_Architecture_Detailed.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

